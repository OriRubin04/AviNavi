[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avinavi"
version = "0.1.0"
description = "GPS-denied visual localization and navigation for ArduPilot (SuperPoint + LightGlue)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "PyYAML>=6.0",
    "pymavlink>=2.4.37",
]

[project.optional-dependencies]
# Everything needed to actually run the visual pipeline on the Pi.
vision = [
    "opencv-python-headless>=4.8",
    "torch>=2.0",
    "lightglue @ git+https://github.com/cvg/LightGlue.git",
]
# Map tile building from GeoTIFF sources.
maps = [
    "rasterio>=1.3",
    "pyproj>=3.5",
]
dev = [
    "pytest>=7.0",
]

[project.scripts]
avinavi = "avinavi.cli.main:main"

[tool.setuptools.packages.find]
include = ["avinavi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
