# AviNavi - GPS-denied visual localization for ArduPilot.
#
# Every value below is a default; nothing in the code hard-codes these.
# Override a single key without editing the file:
#     avinavi run --set mavlink.device=/dev/ttyACM0 --set rates.mavlink_odometry_hz=10
#
# Operating mode: offline | bench | flight   (see docs/safety-and-testing.md)
mode: offline

# ---------------------------------------------------------------------------
# MAVLink transport
# ---------------------------------------------------------------------------
mavlink:
  connection_type: serial        # serial | udp | tcp
  device: /dev/ttyAMA0           # udp example: "udpout:127.0.0.1:14550"
  baudrate: 921600
  system_id: 1                   # must match the autopilot's SYSID_THISMAV
  component_id: 197              # MAV_COMP_ID_VISUAL_INERTIAL_ODOMETRY
  target_system: 1
  target_component: 1
  heartbeat_timeout_s: 3.0
  send_heartbeat: true
  heartbeat_hz: 1.0
  request_attitude_hz: 10.0
  # Ground-truth comparison only. MUST stay false for real GPS-denied
  # operation; the localization loop never reads GPS.
  request_gps_for_ground_truth: false

# ---------------------------------------------------------------------------
# Operator-selected initial position (see docs/initial-position.md)
# ---------------------------------------------------------------------------
initial_position:
  # mavlink_origin: listen for GPS_GLOBAL_ORIGIN, which the autopilot emits
  #                 after Mission Planner's "Set EKF origin here" map action.
  # manual:         use the manual_* values below.
  # auto:           mavlink_origin, falling back to manual on timeout.
  source: mavlink_origin
  wait_timeout_s: 0.0            # 0 = wait indefinitely
  request_origin_on_start: true
  manual_lat_deg: null
  manual_lon_deg: null
  manual_alt_m: null
  push_origin_to_autopilot: false

# ---------------------------------------------------------------------------
# Camera
# ---------------------------------------------------------------------------
camera:
  source: opencv                 # picamera2 | opencv | directory
  device: "0"                    # index/URL for opencv, folder for directory
  width: 1280
  height: 720
  fps: 30.0
  save_frames_dir: null
  # Pinhole intrinsics for the resolution above. Fill these in from your
  # calibration; without them the scale comes only from the tile GSD.
  fx: null
  fy: null
  cx: null
  cy: null
  distortion: []                 # [k1, k2, p1, p2, k3]
  replay_speed: 1.0

  # -- USB (V4L2) camera settings. See docs/usb-camera.md. ------------------
  # All three of these fail QUIETLY if left alone: the camera works, the bench
  # looks fine, and the match rate in the air is poor for reasons that never
  # appear in a log.
  #
  # Uncompressed YUYV at 1280x720x30 needs ~442 Mbit/s, more than USB 2.0
  # delivers, so the camera silently serves fewer frames or a smaller size -
  # which invalidates the intrinsics above. Check with:
  #   v4l2-ctl --list-formats-ext -d /dev/video0
  fourcc: MJPG                   # "" leaves the driver default
  # Auto-exposure over varying terrain reaches for a long shutter, and
  # SuperPoint does not detect smeared corners. At 22 m/s and 0.13 m/px,
  # 1/60 s smears a feature across ~2.8 px; 1/500 s keeps it within 0.3 px.
  lock_exposure: true
  max_exposure_s: 0.002          # 1/500 s
  gain: null                     # null leaves it to the camera; raising gain
                                 # is the honest price of a short shutter.
  # V4L2 commonly queues four buffers and ignores CAP_PROP_BUFFERSIZE, so a
  # 2 Hz loop would read a frame ~0.5 s - eleven metres - out of date.
  drain_to_newest: true
  max_frame_age_s: 0.25
  warmup_frames: 5               # discarded while auto-gain settles

# ---------------------------------------------------------------------------
# Camera -> body (FRD) extrinsics.
# Identity = downward-facing camera whose image +X points along body +X (the
# nose) and image +Y points along body +Y (the right wing); i.e. the nose
# appears at the RIGHT edge of the frame. See docs/coordinate-frames.md for the
# four common mountings and their yaw_deg. Getting this wrong by 90 degrees
# produces a yaw bias the EKF fights rather than rejects, so check it against a
# real frame before the first flight.
# ---------------------------------------------------------------------------
camera_extrinsics:
  rotation:
    roll_deg: 0.0
    pitch_deg: 0.0
    yaw_deg: 0.0
  translation:
    x_m: 0.0
    y_m: 0.0
    z_m: 0.0

# ---------------------------------------------------------------------------
# Rates. Visual localization and MAVLink output are deliberately decoupled.
# ---------------------------------------------------------------------------
rates:
  camera_fps: 30.0
  # 2 Hz is what a Pi 5 sustains with SuperPoint+LightGlue on CPU at
  # resize_max_side 640. Benchmark with `avinavi bench` before raising it; a
  # requested rate the Pi cannot meet silently becomes a lower actual rate.
  visual_localization_hz: 2.0
  # Frame-to-frame odometry. NOT tied to visual_localization_hz, and not a
  # performance knob: Lucas-Kanade needs consecutive frames to overlap, and it
  # was measured to track at a 0.5 s spacing (11 m at 22 m/s, 92% overlap) and
  # to fail outright at 1.0 s (22 m, 84% overlap). Map matching with the
  # learned backend runs at well under 1 Hz, so tracking between localization
  # frames would produce nothing at all. See docs/performance.md.
  visual_odometry_hz: 5.0
  mavlink_odometry_hz: 20.0
  diagnostics_hz: 1.0

# ---------------------------------------------------------------------------
# Feature backend
# ---------------------------------------------------------------------------
features:
  # superpoint: SuperPoint + LightGlue (needs torch).
  # opencv:     SIFT/AKAZE/ORB + Lowe ratio test. No torch, useful as a
  #             fallback and as the measurement baseline.
  backend: superpoint
  detector: sift                 # opencv backend only: sift | akaze | orb
  ratio: 0.8                     # opencv backend only: Lowe's ratio

# ---------------------------------------------------------------------------
# Frame rectification to a synthetic nadir, north-up, tile-GSD view.
#
# NOT an optimisation. SuperPoint carries no orientation and LightGlue was
# trained on pairs within about +/-31.5 degrees, while 10 degrees of bank at
# 120 m already skews the ground sample distance 1.5x across the frame and
# ArduPlane permits 45. Without this, a fixed wing loses lock in every turn.
# See avinavi/localization/prewarp.py and docs/matching-robustness.md.
# ---------------------------------------------------------------------------
prewarp:
  enabled: true
  max_output_side: 768           # caps the warp cost on a Pi
  max_tilt_deg: 55.0             # beyond this the warp is mostly extrapolation
  min_valid_fraction: 0.25
  footprint_margin: 1.05
  require_attitude: true         # a stale attitude warps worse than not warping
  max_attitude_age_s: 0.5
  fallback_to_raw: true          # try the raw frame rather than skip the cycle

# ---------------------------------------------------------------------------
# Photometric normalisation (CLAHE) to bridge the camera/basemap appearance
# gap. Must be applied to BOTH sides: build the tile database with
# `avinavi extract-features --normalize` if this is enabled here.
# ---------------------------------------------------------------------------
photometric:
  enabled: true
  clip_limit: 2.0
  tile_grid: 8
  denoise_sigma: 0.0             # 0 disables the blur

# ---------------------------------------------------------------------------
# Gates that skip a cycle rather than risk a confidently wrong match.
# ---------------------------------------------------------------------------
quality:
  sharpness_gate_enabled: true
  min_sharpness_ratio: 0.45      # relative to the running median
  max_bank_deg: 35.0             # 0 disables the gate

# ---------------------------------------------------------------------------
# SuperPoint (live frames only - tile features are precomputed offline)
# ---------------------------------------------------------------------------
superpoint:
  max_num_keypoints: 1024
  detection_threshold: 0.0005
  nms_radius: 4
  device: auto                   # auto | cpu | cuda
  resize_max_side: 640
  min_keypoints: 64

# ---------------------------------------------------------------------------
# LightGlue
# ---------------------------------------------------------------------------
lightglue:
  features: superpoint
  depth_confidence: 0.95         # early exit; -1 disables
  width_confidence: 0.99         # point pruning; -1 disables
  filter_threshold: 0.1
  device: auto
  max_candidate_tiles: 6

# ---------------------------------------------------------------------------
# Geometric verification (RANSAC / MAGSAC++)
# ---------------------------------------------------------------------------
geometry:
  method: magsac                 # magsac | ransac | lmeds
  model: homography              # homography (planar ground) | affine
  reproj_threshold_px: 3.0
  max_iterations: 5000
  confidence: 0.999
  min_matches: 20
  min_inliers: 15
  min_inlier_ratio: 0.25
  max_reprojection_error_px: 4.0
  min_scale_ratio: 0.25
  max_scale_ratio: 4.0
  min_spatial_spread: 0.15

# ---------------------------------------------------------------------------
# Confidence model. Weights should sum to 1.0.
# ---------------------------------------------------------------------------
confidence:
  weight_inlier_ratio: 0.4
  weight_inlier_count: 0.25
  weight_reprojection: 0.2
  weight_spread: 0.15
  inlier_count_saturation: 120
  reprojection_scale_px: 4.0
  min_confidence: 0.5
  position_sigma_best_m: 1.0
  position_sigma_worst_m: 15.0
  yaw_sigma_best_rad: 0.05
  yaw_sigma_worst_rad: 0.5

# ---------------------------------------------------------------------------
# Tile search window. Recentred on every successful visual fix - never on GPS.
# ---------------------------------------------------------------------------
tile_search:
  search_radius_m: 300.0
  initial_search_radius_m: 500.0
  radius_growth_factor: 1.5
  max_search_radius_m: 2000.0
  failures_before_growth: 2
  prefer_last_matched_tile: true

# ---------------------------------------------------------------------------
# Map database
# ---------------------------------------------------------------------------
map:
  database_path: map_database
  terrain_alt_m: 0.0
  feature_cache_size: 64

# ---------------------------------------------------------------------------
# Pose propagation between visual fixes (never repeats a stale pose forever)
# ---------------------------------------------------------------------------
propagation:
  enabled: true
  max_age_s: 1.0
  use_velocity: true
  max_velocity_dt_s: 2.0
  max_speed_mps: 40.0
  sigma_growth_mps: 2.0

# ---------------------------------------------------------------------------
# Frame-to-frame visual odometry: dead reckoning across a map-matching dropout
# (cloud shadow, water, a hole in the basemap) instead of going silent at
# 22 m/s. Drift is reported honestly as a growing position sigma.
# ---------------------------------------------------------------------------
visual_odometry:
  enabled: true
  max_points: 400
  min_points: 60
  max_dead_reckoning_s: 10.0     # then stop, rather than publish fiction
  drift_fraction: 0.05           # 5 m of assumed error per 100 m flown
  resize_max_side: 480

# ---------------------------------------------------------------------------
# Manual re-anchor: the operator clicks the map to say where to search next.
# Changes only the SEARCH WINDOW; it is not a position fix, and the next frame
# still has to earn its match. See docs/manual-reanchor.md.
# ---------------------------------------------------------------------------
reanchor:
  enabled: true
  # Recommended channel: COMMAND_INT / MAV_CMD_SPATIAL_USER_1 (31005) addressed
  # to this component. No side effects on the aircraft, and we ACK it so the
  # operator sees the click land. Needs tools/mission_planner_plugin/.
  accept_spatial_user: true
  # Overhear "Set EKF Origin Here". The only stock Mission Planner map action
  # that reaches a Pi on its own UART (SET_GPS_GLOBAL_ORIGIN has no
  # target_component, so ArduPilot's router forwards it). ArduPilot rejects the
  # origin change itself once the origin is set, so it is a no-op on the plane.
  # Requires the Pi's system_id to equal the autopilot's.
  accept_set_origin: true
  # Overhear "Point Camera Here" (DO_SET_ROI). Only arrives when the Pi is the
  # telemetry hub; a navigation no-op on a gimbal-less plane. No ACK.
  accept_roi: true
  # "Set Home Here" reaches every link, but it MOVES THE RTL POINT. Off.
  accept_home_position: false
  radius_m: 1500.0               # search radius for the first attempt after
  min_move_m: 25.0               # ignore home re-sends on arming
  control_socket_host: ""        # UDP control endpoint; empty disables it.
  control_socket_port: 14555     # anything reaching this port can redirect the
                                 # search, so keep it on localhost.

# ---------------------------------------------------------------------------
# External navigation output
#
# gps_input is the DEFAULT because it is the only interface a custom
# MatekF405-Wing build can expose with a single feature flag (GPS Drivers ->
# MAV, then GPS1_TYPE=14). A stock F405-Wing ArduPlane build has ODOMETRY,
# VISION_POSITION_ESTIMATE *and* GPS_INPUT all compiled out, and every failure
# is silent. Check that VISO_TYPE exists in your full parameter list before
# choosing odometry. See docs/flight-controller-compatibility.md.
# ---------------------------------------------------------------------------
output:
  message: gps_input             # gps_input | odometry | vision_position_estimate | none
  # SAFETY: transmission is opt-in. Start every new airframe at false and only
  # enable after the bench checks in docs/safety-and-testing.md pass.
  send_to_autopilot: false
  send_velocity: true
  send_quality: true
  timestamp_source: unix         # unix | boot
  # GPS_INPUT specifics. gps_id MUST equal the GPS instance index that
  # GPS1_TYPE=14 creates (0 for GPS1); AP_GPS_MAV ignores any other value.
  gps_input_id: 0
  # EK3_GPS_CHECK requires 6 satellites by default, so anything below 6 is
  # rejected before the EKF ever sees the position. Validation enforces this.
  gps_input_satellites: 12
  gps_input_hdop: 0.9
  gps_input_vdop: 1.3
  # Visual yaw as GPS yaw. Only useful with EK3_SRC1_YAW=2 (GPS); leave false
  # unless you have verified the camera extrinsics yaw against a real frame.
  gps_input_send_yaw: false

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  level: INFO
  directory: logs
  csv_enabled: true
  log_transmitted_messages: true
  console_diagnostics: true

# ---------------------------------------------------------------------------
# Safety gates between the visual solution and the flight controller
# ---------------------------------------------------------------------------
safety:
  required_consecutive_good_fixes: 5
  max_consecutive_failures: 10
  max_position_jump_m: 100.0
  require_heartbeat: true
